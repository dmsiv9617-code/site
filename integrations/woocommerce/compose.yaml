name: woodbase-local
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: woodbase
      MARIADB_USER: woodbase
      MARIADB_PASSWORD: ${DB_PASSWORD:?Generate local .env first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate local .env first}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 30
  wordpress:
    image: wordpress:6.8.3-php8.3-fpm-alpine
    depends_on:
      db: {condition: service_healthy}
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: woodbase
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: woodbase
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('WOODBASE_PRIVATE_DIR', '/var/woodbase-private');
        define('WOODBASE_FRONTEND_ORIGIN', 'http://localhost:5173');
    volumes:
      - wp:/var/www/html
      - private:/var/woodbase-private
      - ./plugin:/var/www/html/wp-content/plugins/woodbase:ro
      - ../../work/woocommerce-downloads:/opt/woodbase-downloads:ro
      - ./bootstrap.php:/opt/woodbase-bootstrap.php:ro
      - ../../public/collection-assets/moments-three-quarter.webp:/opt/woodbase-moments.webp:ro
  web:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    depends_on: [wordpress]
    volumes:
      - wp:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db:
  wp:
  private:
